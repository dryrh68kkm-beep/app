<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12543f">
  <title>ตรวจนับสุรา</title>
  <style>
    :root{--green:#126b52;--deep:#103d32;--soft:#ebf6f0;--line:#dbe9e2;--ink:#152a23;--muted:#6d8179;--bg:#f3f7f5;--red:#b44242}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:16px 14px 44px}header{padding:22px 20px 18px;color:#fff;border-radius:22px;background:linear-gradient(135deg,#0e4033,#17735a)}.eyebrow{margin:0 0 5px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}h1{margin:0;font-size:28px;letter-spacing:-.04em}.sub{margin:6px 0 0;color:#d8eee5;font-size:14px}.date{display:flex;align-items:center;gap:8px;margin-top:16px;padding:10px 12px;border:1px solid #ffffff35;border-radius:12px;background:#ffffff12;font-size:13px}.date input{flex:1;color:#fff;border:0;background:transparent;font:inherit;text-align:right;outline:0;color-scheme:dark}.hint{margin:13px 0;padding:11px 13px;border-radius:12px;color:#28614f;background:#e6f4ec;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab{min-height:54px;border:1px solid var(--line);border-radius:14px;color:#577069;background:#fff;font:inherit;font-size:14px;font-weight:800}.tab.active{color:#fff;background:var(--green);border-color:var(--green);box-shadow:0 7px 16px #126b5230}.area-panel{display:none}.area-panel.active{display:block}.area-total{display:flex;align-items:center;justify-content:space-between;margin:0 0 11px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}.area-total span{font-size:13px;color:var(--muted)}.area-total strong{font-size:20px;color:var(--green)}.card{margin-bottom:10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 4px 12px #1e5c4308}.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.product{font-size:15px;font-weight:800;line-height:1.3}.barcode{margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:.03em}.item-total{flex:0 0 auto;padding:5px 9px;border-radius:9px;color:#146044;background:var(--soft);font-size:13px;font-weight:800}.count-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.count-field{padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fbfdfc}.count-field label{display:block;margin-bottom:4px;color:var(--muted);font-size:11px;font-weight:700}.num{width:100%;height:34px;border:0;outline:0;background:transparent;color:var(--ink);font-size:22px;font-weight:800;text-align:center}.add-product{width:100%;padding:13px;border:1px dashed #9fc6b5;border-radius:14px;color:#176148;background:#f8fcfa;font:inherit;font-weight:800}.summary{margin-top:17px;padding:18px;border-radius:20px;color:#fff;background:linear-gradient(130deg,#103e33,#197056)}.summary h2{margin:0;font-size:19px}.summary p{margin:4px 0 15px;color:#c8e4d9;font-size:13px}.actual{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid #ffffff30}.actual span{color:#c8e4d9;font-size:13px}.actual strong{font-size:29px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}.summary-field{padding:11px 12px;border:1px solid #ffffff2b;border-radius:13px;background:#ffffff12}.summary-field label{display:block;color:#cbe6db;font-size:11px;font-weight:700}.summary-field input{width:100%;height:34px;margin-top:3px;padding:0;border:0;outline:0;color:#fff;background:transparent;font:inherit;font-size:22px;font-weight:800;text-align:center}.summary-field.total{display:flex;flex-direction:column;justify-content:center}.summary-field.total strong{margin-top:4px;font-size:21px}.difference{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.difference strong{font-size:24px}.positive strong{color:#a8f1ca}.negative strong{color:#ffc5bf}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{min-height:47px;border:0;border-radius:13px;font:inherit;font-weight:800}.clear{color:#255b49;background:#fff}.line{color:#fff;background:#06c755}.toast{position:fixed;left:50%;bottom:22px;z-index:10;display:none;max-width:calc(100% - 32px);padding:11px 16px;border-radius:999px;color:#fff;background:#1d332b;transform:translateX(-50%);font-size:13px;font-weight:700}.toast.show{display:block}@media(min-width:620px){.app{padding-top:28px}.product{font-size:16px}.card{padding:16px}.count-grid{max-width:340px}}
  </style>
</head>
<body>
  <main class="app">
    <header><p class="eyebrow">Liquor Stock Count</p><h1>ตรวจนับสุรา</h1><p class="sub">กรอกง่ายทีละพื้นที่ • 1 ลัง = 12 ขวด</p><div class="date"><span>วันที่ตรวจนับ</span><input id="countDate" type="date"></div></header>
    <div class="hint">เลือกพื้นที่ แล้วใส่จำนวน <b>ลัง</b> และ <b>ขวด</b> ของสินค้าจริง</div>
    <nav class="tabs"><button class="tab active" data-zone="floor">Sales Floor</button><button class="tab" data-zone="room">Stockroom</button></nav>
    <section id="floorPanel" class="area-panel active"><div class="area-total"><span>ยอดตรวจจริง Sales Floor</span><strong id="floorTotal">0 ขวด</strong></div><div class="product-list"></div><button class="add-product" data-add="floor">+ เพิ่มสินค้าใน Sales Floor</button></section>
    <section id="roomPanel" class="area-panel"><div class="area-total"><span>ยอดตรวจจริง Stockroom</span><strong id="roomTotal">0 ขวด</strong></div><div class="product-list"></div><button class="add-product" data-add="room">+ เพิ่มสินค้าใน Stockroom</button></section>
    <section class="summary"><h2>สรุปยอดรวม</h2><p>กรอกยอดจากระบบและยอดขายเพียงครั้งเดียวด้านล่าง</p><div class="actual"><span>ยอดตรวจจริงทั้งหมด</span><strong id="actualTotal">0 ขวด</strong></div><div class="summary-grid"><div class="summary-field"><label for="systemTotal">Stock System (ขวด)</label><input id="systemTotal" inputmode="numeric" type="number" min="0" value="0"></div><div class="summary-field total"><label>ผลต่างตรวจจริง − ระบบ</label><strong id="differenceTotal">0 ขวด</strong></div><div class="summary-field"><label for="salesCases">ขายไป (ลัง)</label><input id="salesCases" inputmode="numeric" type="number" min="0" value="0"></div><div class="summary-field"><label for="salesBottles">ขายไป (ขวด)</label><input id="salesBottles" inputmode="numeric" type="number" min="0" value="0"></div><div id="salesTotalCard" class="summary-field total difference"><label>ยอดขายรวม</label><strong id="salesTotal">0 ขวด</strong></div></div><div class="actions"><button class="clear" id="reset">ล้างยอดที่กรอก</button><button class="line" id="shareLine">ส่งสรุปผ่าน LINE</button></div></section>
  </main><div id="toast" class="toast"></div>
  <template id="productTemplate"><article class="card"><div class="card-top"><div><div class="product"></div><div class="barcode"></div></div><div class="item-total">0 ขวด</div></div><div class="count-grid"><div class="count-field"><label>จำนวนลัง</label><input class="cases num" type="number" min="0" inputmode="numeric" value="0"></div><div class="count-field"><label>จำนวนขวด</label><input class="bottles num" type="number" min="0" inputmode="numeric" value="0"></div></div></article></template>
  <script>
    const CASE_SIZE=12,KEY='liquor-count-mobile-v2',OLD_KEY='liquor-count-v1';
    const MASTER=[['หงส์ทอง 35 ดีกรี 350 ซีซี','8852388000620'],['แสงโสมเหรียญทอง 700 ซีซี','8851707000181'],['แสงโสม 200 มล.','8851707000198'],['แสงโสมเหรียญทอง 300 ซีซี','8851707000174'],['หงส์ทอง 35 ดีกรี 700 ซีซี','8852388000613'],['หงส์ทอง 200 มล.','8852388000767']].map(([name,barcode])=>({name,barcode,cases:0,bottles:0}));
    const $=s=>document.querySelector(s),num=x=>Math.max(0,Number(x)||0),fmt=n=>new Intl.NumberFormat('th-TH').format(n),sign=n=>`${n>0?'+':''}${fmt(n)}`;
    let state={date:new Date().toISOString().slice(0,10),floor:structuredClone(MASTER),room:structuredClone(MASTER),system:0,salesCases:0,salesBottles:0};
    const migrate=()=>{let old;try{old=JSON.parse(localStorage.getItem(OLD_KEY))}catch(e){}if(!old)return;[['front','floor'],['back','room']].forEach(([from,to])=>{if(Array.isArray(old[from])&&old[from].length)state[to]=old[from].map(x=>({name:x.product||'ไม่ระบุสินค้า',barcode:x.barcode||'',cases:num(x.cases),bottles:num(x.bottles)}))});state.date=old.date||state.date;state.system=['front','back'].flatMap(z=>old[z]||[]).reduce((s,x)=>s+num(x.system),0);state.salesCases=['front','back'].flatMap(z=>old[z]||[]).reduce((s,x)=>s+num(x.soldCases),0);state.salesBottles=['front','back'].flatMap(z=>old[z]||[]).reduce((s,x)=>s+num(x.soldBottles),0)};
    const rowTotal=x=>num(x.cases)*CASE_SIZE+num(x.bottles),zoneTotal=z=>state[z].reduce((s,x)=>s+rowTotal(x),0),save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const render=()=>['floor','room'].forEach(zone=>{const list=$(`#${zone}Panel .product-list`);list.innerHTML='';state[zone].forEach((item,i)=>{const card=$('#productTemplate').content.firstElementChild.cloneNode(true);card.querySelector('.product').textContent=item.name;card.querySelector('.barcode').textContent=item.barcode||'ไม่มีบาร์โค้ด';card.querySelector('.cases').value=item.cases;card.querySelector('.bottles').value=item.bottles;const redraw=()=>{card.querySelector('.item-total').textContent=`${fmt(rowTotal(state[zone][i]))} ขวด`;update()};card.querySelector('.cases').addEventListener('input',e=>{state[zone][i].cases=num(e.target.value);redraw()});card.querySelector('.bottles').addEventListener('input',e=>{state[zone][i].bottles=num(e.target.value);redraw()});list.append(card);redraw()})});
    const update=()=>{const floor=zoneTotal('floor'),room=zoneTotal('room'),actual=floor+room,system=num(state.system),sales=num(state.salesCases)*CASE_SIZE+num(state.salesBottles),diff=actual-system;$('#floorTotal').textContent=`${fmt(floor)} ขวด`;$('#roomTotal').textContent=`${fmt(room)} ขวด`;$('#actualTotal').textContent=`${fmt(actual)} ขวด`;$('#differenceTotal').textContent=`${sign(diff)} ขวด`;$('#differenceTotal').parentElement.className=`summary-field total ${diff>0?'positive':diff<0?'negative':''}`;$('#salesTotal').textContent=`${fmt(sales)} ขวด`;save()};
    const toast=m=>{const el=$('#toast');el.textContent=m;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)};
    const add=z=>{const name=prompt('ชื่อสินค้า');if(!name)return;const barcode=prompt('บาร์โค้ด (เว้นว่างได้)')||'';state[z].push({name,barcode,cases:0,bottles:0});render();update()};
    const load=()=>{try{const saved=JSON.parse(localStorage.getItem(KEY));saved?state={...state,...saved}:migrate()}catch(e){}$('#countDate').value=state.date;$('#systemTotal').value=state.system;$('#salesCases').value=state.salesCases;$('#salesBottles').value=state.salesBottles;render();update()};
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{const z=tab.dataset.zone;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.area-panel').forEach(x=>x.classList.toggle('active',x.id===`${z}Panel`));window.scrollTo({top:0,behavior:'smooth'})}));
    document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.add)));$('#countDate').addEventListener('input',e=>{state.date=e.target.value;save()});$('#systemTotal').addEventListener('input',e=>{state.system=num(e.target.value);update()});$('#salesCases').addEventListener('input',e=>{state.salesCases=num(e.target.value);update()});$('#salesBottles').addEventListener('input',e=>{state.salesBottles=num(e.target.value);update()});$('#reset').addEventListener('click',()=>{if(!confirm('ล้างเฉพาะตัวเลขที่กรอกทั้งหมดใช่หรือไม่?'))return;['floor','room'].forEach(z=>state[z].forEach(x=>{x.cases=0;x.bottles=0}));state.system=0;state.salesCases=0;state.salesBottles=0;render();update();toast('ล้างยอดที่กรอกแล้ว')});
    $('#shareLine').addEventListener('click',()=>{const floor=zoneTotal('floor'),room=zoneTotal('room'),actual=floor+room,system=num(state.system),sales=num(state.salesCases)*CASE_SIZE+num(state.salesBottles),date=state.date?new Date(`${state.date}T00:00:00`).toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'}):'-';const text=`📋 สรุปตรวจนับสุรา\nวันที่: ${date}\n━━━━━━━━━━━━\n🏪 Sales Floor: ${fmt(floor)} ขวด\n📦 Stockroom: ${fmt(room)} ขวด\n✅ ตรวจจริงรวม: ${fmt(actual)} ขวด\n📊 Stock System: ${fmt(system)} ขวด\n⚠️ ผลต่าง: ${sign(actual-system)} ขวด\n🛒 ขายไป: ${fmt(sales)} ขวด`;const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;top:-999px';document.body.append(area);area.select();document.execCommand('copy');area.remove();toast('คัดลอกสรุปแล้ว กำลังเปิด LINE');window.location.href=`https://line.me/R/msg/text/?${encodeURIComponent(text)}`});
    load();
  </script>
</body>
</html>
